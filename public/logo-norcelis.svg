<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .nor-text {
        font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 112px;
        fill: #16284F;
        letter-spacing: 0.01em;
      }
      .celis-text {
        font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 124px;
        fill: #F28220;
        letter-spacing: -0.02em;
      }
      .automotriz-text {
        font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 23px;
        fill: #16284F;
        letter-spacing: 0.40em;
      }
    </style>
  </defs>

  <!-- Isotipo Oficial Nor Celis -->
  <g id="emblem-group" fill="#16284F">
    <!-- Línea de velocidad central -->
    <rect x="6" y="113" width="76" height="24" />

    <!-- Línea de velocidad superior -->
    <rect x="42" y="52" width="62" height="24" />

    <!-- Línea de velocidad inferior -->
    <rect x="42" y="174" width="62" height="24" />

    <!-- Aro circular: Centro (140, 125), R_ext=95, R_int=71 -->
    <path fill-rule="evenodd" d="M 140,30 A 95,95 0 1,0 140,220 A 95,95 0 1,0 140,30 Z M 140,54 A 71,71 0 1,1 140,196 A 71,71 0 1,1 140,54 Z" />

    <!-- Cuadrante interior 90° (12:00 hacia centro y centro hacia 3:00) -->
    <rect x="128" y="54" width="24" height="83" />
    <rect x="128" y="113" width="83" height="24" />
  </g>

  <!-- Tipografía Oficial -->
  <g id="typography-group">
    <!-- "NOR" -->
    <text x="285" y="98" class="nor-text">NOR</text>

    <!-- "CELIS" -->
    <text x="285" y="206" class="celis-text">CELIS</text>

    <!-- "AUTOMOTRIZ" -->
    <text x="290" y="254" class="automotriz-text">AUTOMOTRIZ</text>
  </g>
</svg>
